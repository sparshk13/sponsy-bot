services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: sponsy
      POSTGRES_USER: sponsy_app
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sponsy_pass}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sponsy_app -d sponsy"]
      interval: 3s
      timeout: 3s
      retries: 5

  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    environment:
      APP_ENV: dev
      DATABASE_URL: postgresql+psycopg://sponsy_app:${POSTGRES_PASSWORD:-sponsy_pass}@postgres:5432/sponsy
      TIMEZONE: Asia/Kolkata
      PUBLIC_URL: http://localhost
    depends_on:
      postgres:
        condition: service_healthy

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
    depends_on:
      - api

volumes:
  pgdata:
